[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ter-i"
version = "3.1.0"
description = "TER I — TenIII Generation 3 inference runtime companion"
readme = "ter_i/README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TER I contributors" }]
keywords = ["teniii", "inference-runtime", "multimodal", "local-first", "robotics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
ter-i = "ter_i.cli:main"

[tool.setuptools]
packages = ["ter_i"]
include-package-data = true
